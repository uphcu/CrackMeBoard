{% extends "core/base.html" %}
{% block title %}글쓰기 - CrackMeBoard{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4">글쓰기</h2>
        <form method="POST" id="post-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="title" class="form-label">제목</label>
                <input type="text" class="form-control" id="title" name="title"
                       maxlength="200" required autofocus>
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">내용</label>
                <textarea class="form-control" id="content" name="content" rows="10" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">등록</button>
            <a href="{{ url_for('board.index') }}" class="btn btn-secondary">취소</a>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('post-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const data = new FormData(form);
    try {
        const res = await fetch('{{ url_for("board.create") }}', {
            method: 'POST',
            headers: {'X-CSRFToken': form.csrf_token.value},
            body: data
        });
        const json = await res.json();
        if (res.ok) {
            window.location.href = json.id ? `/board/${json.id}` : '{{ url_for("board.index") }}';
        } else {
            alert(json.error || '등록 실패');
        }
    } catch (err) {
        alert('서버 오류가 발생했습니다.');
    }
});
</script>
{% endblock %}
